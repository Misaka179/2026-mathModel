id: data-review
name: 数据审计多模型复核 (缺失处理/变换与共线性/模型假设匹配)
description: 手动粘贴 data_audit.md，由三位审查员并行独立审查：①缺失值/异常值/重复值处理 ②数据变换/共线性/泄漏 ③模型假设匹配/参数可估计性。输出冲突问题汇总供人工裁决。注：引用的 b-data-*-reviewer persona 需先在 chorus cockpit 的 Personas 页创建。
author: user
agreementThreshold: 0.5
onThresholdMet: merge
maxRounds: 1
yoloDefault: false
estimatedBaselineTokens: 900
ship:
  enabled: false
phases:
  - id: data-review
    kind: review_only
    title: 数据审计三方复核
    description: 缺失处理 / 变换与共线性 / 模型假设匹配三位审查员并行审查 data_audit.md。
    reviewer:
      require: 3
      crossLineage: true
      candidates:
        - lineage: anthropic
          models:
            - claude-opus-5
          persona: b-data-missing-reviewer
        - lineage: openai
          models:
            - gpt-5.6-sol
          persona: b-data-transform-reviewer
        - lineage: opencode
          models:
            - deepseek/deepseek-v4-pro
          persona: b-data-assumption-reviewer
    artifact:
      label: 数据审计报告 (md)
      hint: 粘贴你要复核的 data_audit.md 全文（15 维度检查与人工决策点）。
      maxBytes: 1048576
    inputs:
      include: []
      exclude: []
